version: 2

models:
  - name: stg_clients
    description: "Cadastro tipado e deduplicado; granularidade: um registro selecionado por client_id."
    config:
      tags: ["integrity"]
    columns:
      - name: client_id
        description: "Identificador do cliente."
        data_tests: [not_null, unique]
      - name: name
        description: "Nome cadastral."
      - name: city
        description: "Cidade cadastral."
      - name: state
        description: "UF cadastral."
      - name: created_at
        description: "Data de criação."
      - name: completeness_score
        description: "Quantidade de campos preenchidos."
      - name: source_record_key
        description: "Fingerprint do registro de origem."
        data_tests: [not_null]
  - name: stg_transactions
    description: "Transações tipadas com flags de validade; granularidade: um registro de origem."
    config:
      tags: ["integrity"]
    columns:
      - name: transaction_id
        description: "Identificador da operação."
        data_tests: [not_null]
      - name: client_id
        description: "Cliente informado na origem."
      - name: asset_ticker
        description: "Código do ativo."
      - name: operation
        description: "Operação normalizada."
        data_tests:
          - accepted_values:
              values: ["BUY", "SELL"]
      - name: quantity
        description: "Quantidade original."
      - name: unit_price
        description: "Preço unitário original."
      - name: transaction_date
        description: "Data da operação."
      - name: source_record_key
        description: "Fingerprint do registro de origem."
        data_tests: [not_null]
      - name: duplicate_rank
        description: "Ordem determinística dentro do transaction_id."
      - name: is_valid
        description: "Indica se os campos essenciais são válidos."
  - name: audit_rejected_transactions
    description: "Registros que não alimentam os modelos curados; granularidade: um registro rejeitado."
    columns:
      - name: source_record_key
        description: "Fingerprint do registro rejeitado."
        data_tests: [not_null]
      - name: transaction_id
        description: "Identificador da transação rejeitada."
      - name: client_id
        description: "Cliente informado."
      - name: asset_ticker
        description: "Ativo informado."
      - name: operation
        description: "Operação informada."
      - name: quantity
        description: "Quantidade informada."
      - name: unit_price
        description: "Preço informado."
      - name: transaction_date
        description: "Data informada."
      - name: duplicate_rank
        description: "Ordem do registro duplicado."
      - name: rejection_reason
        description: "Motivo determinístico da rejeição."
        data_tests: [not_null]
  - name: int_transactions
    description: "Transações válidas relacionadas a clientes válidos; granularidade: uma transação curada."
    config:
      tags: ["integrity"]
    columns:
      - name: source_record_key
        description: "Fingerprint do registro de origem."
      - name: transaction_id
        description: "Identificador único da operação curada."
        data_tests: [not_null, unique]
      - name: client_id
        description: "Cliente relacionado."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_clients')
              field: client_id
      - name: asset_ticker
        description: "Código do ativo."
        data_tests: [not_null]
      - name: operation
        description: "BUY ou SELL."
        data_tests:
          - not_null
          - accepted_values:
              values: ["BUY", "SELL"]
      - name: quantity
        description: "Quantidade positiva."
        data_tests: [not_null]
      - name: unit_price
        description: "Preço unitário positivo."
        data_tests: [not_null]
      - name: transaction_date
        description: "Data da operação."
        data_tests: [not_null]
      - name: gross_amount
        description: "quantity multiplicada por unit_price."
      - name: signed_quantity
        description: "Quantidade positiva em BUY e negativa em SELL."
      - name: signed_amount
        description: "Valor positivo em BUY e negativo em SELL."
  - name: fact_transactions
    description: "Fato transacional curado; granularidade: uma linha por transaction_id."
    config:
      tags: ["integrity"]
    columns:
      - name: source_record_key
        description: "Fingerprint do registro de origem."
      - name: transaction_id
        description: "Chave única da transação."
        data_tests: [not_null, unique]
      - name: client_id
        description: "Cliente da operação."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_clients')
              field: client_id
      - name: asset_ticker
        description: "Ativo negociado."
        data_tests: [not_null]
      - name: operation
        description: "BUY ou SELL."
        data_tests:
          - not_null
          - accepted_values:
              values: ["BUY", "SELL"]
      - name: quantity
        description: "Quantidade positiva."
      - name: unit_price
        description: "Preço unitário."
      - name: transaction_date
        description: "Data da operação."
      - name: gross_amount
        description: "Valor bruto."
      - name: signed_quantity
        description: "Quantidade com sinal."
      - name: signed_amount
        description: "Valor com sinal."
  - name: dim_clients
    description: "Dimensão cadastral; granularidade: uma linha por client_id, inclusive sem transações."
    config:
      tags: ["integrity"]
    columns:
      - name: client_id
        description: "Chave única do cliente."
        data_tests: [not_null, unique]
      - name: name
        description: "Nome do cliente."
      - name: city
        description: "Cidade do cliente."
      - name: state
        description: "UF do cliente."
      - name: created_at
        description: "Data de criação."
      - name: completeness_score
        description: "Completude usada na seleção."
      - name: source_record_key
        description: "Fingerprint do cadastro selecionado."
  - name: mart_client_portfolio
    description: "Posição agregada; granularidade: uma linha por client_id e asset_ticker."
    config:
      tags: ["integrity"]
    columns:
      - name: client_id
        description: "Cliente da posição."
        data_tests: [not_null]
      - name: asset_ticker
        description: "Ativo da posição."
        data_tests: [not_null]
      - name: total_buy_quantity
        description: "Soma das quantidades compradas."
      - name: total_sell_quantity
        description: "Soma das quantidades vendidas."
      - name: net_quantity
        description: "Soma de signed_quantity; pode ser negativa."
      - name: gross_buy_amount
        description: "Valor bruto das compras."
      - name: gross_sell_amount
        description: "Valor bruto das vendas."
      - name: net_amount
        description: "Fluxo financeiro líquido, não valor de mercado ou rentabilidade."
